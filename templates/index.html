<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌾 KrishiSaathi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #e8f5e8 0%, #f0f8f0 50%, #e0f2e0 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1" fill="%23ffffff" opacity="0.1"/><circle cx="80" cy="40" r="0.5" fill="%23ffffff" opacity="0.1"/><circle cx="40" cy="80" r="1.5" fill="%23ffffff" opacity="0.05"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>') repeat;
            pointer-events: none;
            z-index: 1;
        }
        
        .container { 
            max-width: 700px; 
            margin: 0 auto; 
            padding: 30px 20px;
            position: relative;
            z-index: 2;
        }
        
        .header { 
            text-align: center; 
            margin-bottom: 40px;
            color: #2d5a2d;
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(45, 90, 45, 0.1);
        }
        
        .header p {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }
        
        .chat-box { 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(45, 90, 45, 0.1), 0 8px 32px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .messages { 
            height: 450px; 
            overflow-y: auto; 
            padding: 30px;
            background: linear-gradient(to bottom, rgba(248, 252, 248, 0.3), rgba(255, 255, 255, 0.1));
        }
        
        .messages::-webkit-scrollbar {
            width: 6px;
        }
        
        .messages::-webkit-scrollbar-track {
            background: rgba(45, 90, 45, 0.05);
            border-radius: 3px;
        }
        
        .messages::-webkit-scrollbar-thumb {
            background: rgba(45, 90, 45, 0.2);
            border-radius: 3px;
        }
        
        .message { 
            margin-bottom: 20px;
            animation: fadeInUp 0.3s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user { text-align: right; }
        
        .user .bubble { 
            background: linear-gradient(135deg, #66bb6a, #4caf50);
            color: white; 
            padding: 14px 20px; 
            border-radius: 20px 20px 6px 20px; 
            display: inline-block; 
            max-width: 75%;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
            font-weight: 400;
            line-height: 1.4;
            word-wrap: break-word;
            word-break: break-word;
            white-space: pre-wrap;
        }
        
        .bot .bubble { 
            background: rgba(248, 252, 248, 0.9);
            color: #2d5a2d; 
            padding: 14px 20px; 
            border-radius: 20px 20px 20px 6px; 
            display: inline-block; 
            max-width: 75%;
            box-shadow: 0 4px 12px rgba(45, 90, 45, 0.08);
            border: 1px solid rgba(45, 90, 45, 0.1);
            font-weight: 400;
            line-height: 1.5;
            word-wrap: break-word;
            word-break: break-word;
            white-space: pre-wrap;
        }
        
        .input-area { 
            padding: 25px 30px;
            background: rgba(248, 252, 248, 0.6);
            backdrop-filter: blur(5px);
        }
        
        .input-row { 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            margin-bottom: 15px;
        }
        
        .controls-row { 
            display: flex; 
            gap: 12px; 
            justify-content: center;
            flex-wrap: wrap;
        }
        
        select { 
            padding: 10px 14px;
            border: 1px solid rgba(45, 90, 45, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: #2d5a2d;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
        }
        
        select:focus {
            border-color: #66bb6a;
            box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.1);
        }
        
        .message-input { 
            flex: 1; 
            padding: 14px 20px;
            border: 1px solid rgba(45, 90, 45, 0.2);
            border-radius: 25px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            color: #2d5a2d;
            outline: none;
            transition: all 0.2s ease;
            font-weight: 400;
            resize: none;
            min-height: 50px;
            max-height: 120px;
            overflow-y: auto;
            font-family: 'Inter', sans-serif;
            line-height: 1.4;
        }
        
        .message-input:focus {
            border-color: #66bb6a;
            box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.1);
        }
        
        .message-input::placeholder {
            color: rgba(45, 90, 45, 0.5);
        }
        
        input[type="file"] { display: none; }
        
        button { 
            padding: 12px 18px;
            background: linear-gradient(135deg, #66bb6a, #4caf50);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.2);
        }
        
        button:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(76, 175, 80, 0.3);
        }
        
        .btn-secondary { 
            background: linear-gradient(135deg, #42a5f5, #2196f3);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.2);
        }
        
        .btn-secondary:hover { 
            box-shadow: 0 6px 16px rgba(33, 150, 243, 0.3);
        }
        
        .btn-voice { 
            background: linear-gradient(135deg, #ffb74d, #ff9800);
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.2);
        }
        
        .btn-voice:hover { 
            box-shadow: 0 6px 16px rgba(255, 152, 0, 0.3);
        }
        
        .btn-voice.recording { 
            background: linear-gradient(135deg, #ef5350, #f44336);
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse { 
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        
        .image-preview { 
            max-width: 200px;
            max-height: 200px;
            margin: 15px 0;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(45, 90, 45, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.8);
        }
        
        /* Floating elements for ambiance */
        .floating-leaf {
            position: fixed;
            opacity: 0.1;
            pointer-events: none;
            z-index: 1;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
    </style>
</head>
<body>
    <!-- Floating nature elements -->
    <div class="floating-leaf" style="top: 10%; left: 5%; font-size: 2rem;">🌿</div>
    <div class="floating-leaf" style="top: 20%; right: 8%; font-size: 1.5rem; animation-delay: -2s;">🍃</div>
    <div class="floating-leaf" style="bottom: 15%; left: 10%; font-size: 1.8rem; animation-delay: -4s;">🌱</div>
    <div class="floating-leaf" style="bottom: 25%; right: 15%; font-size: 1.3rem; animation-delay: -1s;">🌾</div>
    
    <div class="container">
        <div class="header">
            <h1>🌾 KrishiSaathi</h1>
            <p>Your Peaceful AI Farming Companion</p>
        </div>
        
        <div class="chat-box">
            <div class="messages" id="messages">
                <div class="message bot">
                    <div class="bubble">🙏 Namaste! I'm KrishiSaathi, your peaceful farming companion. Feel free to ask me about crops, pests, irrigation, or share images of your plants. I'm here to help you grow naturally. 🌱</div>
                </div>
            </div>
            
            <div class="input-area">
                <div class="input-row">
                    <select id="language">
                        <option value="en">English</option>
                        <option value="hi">हिंदी (Hindi)</option>
                        <option value="bn">বাংলা (Bengali)</option>
                        <option value="te">తెలుగు (Telugu)</option>
                        <option value="mr">मराठी (Marathi)</option>
                        <option value="ta">தமிழ் (Tamil)</option>
                        <option value="gu">ગુજરાતી (Gujarati)</option>
                        <option value="kn">ಕನ್ನಡ (Kannada)</option>
                        <option value="ml">മലയാളം (Malayalam)</option>
                        <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                        <option value="or">ଓଡ଼ିଆ (Odia)</option>
                        <option value="as">অসমীয়া (Assamese)</option>
                        <option value="ur">اردو (Urdu)</option>
                        <option value="sa">संस्कृत (Sanskrit)</option>
                        <option value="ne">नेपाली (Nepali)</option>
                        <option value="si">සිංහල (Sinhala)</option>
                        <option value="ks">कॉशुर (Kashmiri)</option>
                        <option value="sd">سنڌي (Sindhi)</option>
                        <option value="mai">मैथिली (Maithili)</option>
                        <option value="bho">भोजपुरी (Bhojpuri)</option>
                        <option value="raj">राजस्थानी (Rajasthani)</option>
                        <option value="gom">कोंकणी (Konkani)</option>
                        <option value="mni">মৈতৈলোন্ (Manipuri)</option>
                        <option value="sat">ᱥᱟᱱᱛᱟᱲᱤ (Santali)</option>
                    </select>
                    <textarea id="messageInput" class="message-input" placeholder="Ask your farming question..." onkeypress="handleEnter(event)" oninput="autoResize(this)"></textarea>
                    <button onclick="sendMessage()">Send</button>
                </div>
                <div class="controls-row">
                    <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
                    <button onclick="document.getElementById('imageInput').click()" class="btn-secondary">📷 Upload Image</button>
                    <button id="voiceBtn" onclick="toggleVoice()" class="btn-voice">🎤 Voice</button>
                    <button onclick="clearImage()" class="btn-secondary">Clear Image</button>
                </div>
                <div id="imagePreview"></div>
            </div>
        </div>
    </div>

    <script>
        let currentImage = null;
        let isRecording = false;
        let recognition = null;

        // Initialize speech recognition
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';
        }

        function handleEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        function addMessage(text, sender) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = `<div class="bubble">${text}</div>`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImage = e.target.result;
                    const preview = document.getElementById('imagePreview');
                    preview.innerHTML = `<img src="${currentImage}" class="image-preview" alt="Uploaded image">`;
                };
                reader.readAsDataURL(file);
            }
        }

        function clearImage() {
            currentImage = null;
            document.getElementById('imagePreview').innerHTML = '';
            document.getElementById('imageInput').value = '';
        }

        function speakText(text, language) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                const langMap = {
                    'en': 'en-US', 'hi': 'hi-IN', 'bn': 'bn-BD', 'te': 'te-IN', 'mr': 'mr-IN',
                    'ta': 'ta-IN', 'gu': 'gu-IN', 'kn': 'kn-IN', 'ml': 'ml-IN', 'pa': 'pa-IN',
                    'or': 'hi-IN', 'as': 'hi-IN', 'ur': 'ur-PK', 'sa': 'hi-IN', 'ne': 'ne-NP',
                    'si': 'si-LK', 'ks': 'hi-IN', 'sd': 'hi-IN', 'mai': 'hi-IN', 'bho': 'hi-IN',
                    'raj': 'hi-IN', 'gom': 'hi-IN', 'mni': 'hi-IN', 'sat': 'hi-IN'
                };
                utterance.lang = langMap[language] || 'en-US';
                utterance.rate = 0.8;
                utterance.onend = () => {
                    document.querySelectorAll('.bubble button').forEach(btn => {
                        if (btn.innerHTML === '🛑') btn.innerHTML = '🔊';
                    });
                };
                speechSynthesis.speak(utterance);
            } else {
                alert('Speech synthesis not supported in this browser');
            }
        }

        function toggleVoice() {
            if (!recognition) {
                alert('Speech recognition not supported in this browser');
                return;
            }

            const voiceBtn = document.getElementById('voiceBtn');
            const language = document.getElementById('language').value;
            
            if (isRecording) {
                recognition.stop();
                isRecording = false;
                voiceBtn.textContent = '🎤 Voice';
                voiceBtn.classList.remove('recording');
            } else {
                const voiceLangMap = {
                    'en': 'en-US', 'hi': 'hi-IN', 'bn': 'bn-IN', 'te': 'te-IN', 'mr': 'mr-IN',
                    'ta': 'ta-IN', 'gu': 'gu-IN', 'kn': 'kn-IN', 'ml': 'ml-IN', 'pa': 'pa-IN',
                    'or': 'or-IN', 'as': 'as-IN', 'ur': 'ur-IN', 'sa': 'sa-IN', 'ne': 'ne-NP',
                    'si': 'si-LK', 'ks': 'ks-IN', 'sd': 'sd-IN', 'mai': 'mai-IN', 'bho': 'bho-IN',
                    'raj': 'raj-IN', 'gom': 'gom-IN', 'mni': 'mni-IN', 'sat': 'sat-IN'
                };
                recognition.lang = voiceLangMap[language] || 'en-US';
                recognition.start();
                isRecording = true;
                voiceBtn.textContent = '🛑 Stop';
                voiceBtn.classList.add('recording');
            }
        }

        if (recognition) {
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('messageInput').value = transcript;
                isRecording = false;
                document.getElementById('voiceBtn').textContent = '🎤 Voice';
                document.getElementById('voiceBtn').classList.remove('recording');
            };

            recognition.onerror = function(event) {
                console.error('Speech recognition error:', event.error);
                isRecording = false;
                document.getElementById('voiceBtn').textContent = '🎤 Voice';
                document.getElementById('voiceBtn').classList.remove('recording');
            };
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const language = document.getElementById('language').value;
            const message = input.value.trim();
            
            if (!message.trim() && !currentImage) return;
            
            if (message) addMessage(message, 'user');
            if (currentImage) addMessage('📷 Image uploaded', 'user');
            
            input.value = '';
            
            try {
                const payload = { message, language };
                if (currentImage) payload.image = currentImage;
                
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                addMessage(data.response, 'bot');
                
                // Add speak button to bot message
                const messages = document.getElementById('messages');
                const lastMessage = messages.lastElementChild;
                const speakBtn = document.createElement('button');
                speakBtn.innerHTML = '🔊';
                speakBtn.style.cssText = 'margin-left: 10px; padding: 5px 10px; background: #2196F3; color: white; border: none; border-radius: 15px; cursor: pointer; font-size: 12px;';
                speakBtn.onclick = () => {
                    const currentLang = document.getElementById('language').value;
                    if (speechSynthesis.speaking) {
                        speechSynthesis.cancel();
                        speakBtn.innerHTML = '🔊';
                    } else {
                        speakText(data.response, currentLang);
                        speakBtn.innerHTML = '🛑';
                        setTimeout(() => { speakBtn.innerHTML = '🔊'; }, 100);
                    }
                };
                lastMessage.querySelector('.bubble').appendChild(speakBtn);
                
            } catch (error) {
                addMessage('Sorry, something went wrong. Please try again.', 'bot');
            }
            
            clearImage();
        }
    </script>
</body>
</html>
